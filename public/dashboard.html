<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rusha Electronics - Social Media Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
                            400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8',
                            800: '#1e40af', 900: '#1e3a8a', 950: '#172554'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #3b82f6 100%); }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
        .modal-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
        .platform-facebook { background: #1877F2; }
        .platform-instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .platform-tiktok { background: #000000; }
        .platform-whatsapp { background: #25D366; }
        .platform-twitter { background: #1DA1F2; }
        .platform-youtube { background: #FF0000; }
        .platform-other { background: #6B7280; }
        .stat-card { background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.7)); backdrop-filter: blur(10px); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Top Navigation -->
    <nav class="gradient-bg text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="badge.png" alt="Logo" class="h-10 w-10 rounded-full border-2 border-white/30">
                <div>
                    <h1 class="font-bold text-lg leading-tight">Rusha Electronics</h1>
                    <p class="text-xs text-blue-200">Social Media Dashboard</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a href="index.html" class="px-4 py-2 bg-white/20 rounded-full text-sm font-semibold hover:bg-white/30 transition-all">
                    <i class="fas fa-home mr-1"></i> Website
                </a>
                <button onclick="openAddModal()" class="px-4 py-2 bg-white text-blue-700 rounded-full text-sm font-bold hover:bg-blue-50 transition-all shadow-lg">
                    <i class="fas fa-plus mr-1"></i> Add Post
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- Summary Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="stat-card rounded-2xl p-5 border border-blue-100 shadow-sm card-hover">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-10 h-10 rounded-xl bg-blue-500 flex items-center justify-center">
                        <i class="fas fa-eye text-white text-lg"></i>
                    </div>
                    <span class="text-sm text-gray-500 font-medium">Total Views</span>
                </div>
                <p id="totalViews" class="text-3xl font-black text-gray-800">0</p>
            </div>
            <div class="stat-card rounded-2xl p-5 border border-red-100 shadow-sm card-hover">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-10 h-10 rounded-xl bg-red-500 flex items-center justify-center">
                        <i class="fas fa-heart text-white text-lg"></i>
                    </div>
                    <span class="text-sm text-gray-500 font-medium">Reactions</span>
                </div>
                <p id="totalReactions" class="text-3xl font-black text-gray-800">0</p>
            </div>
            <div class="stat-card rounded-2xl p-5 border border-green-100 shadow-sm card-hover">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-10 h-10 rounded-xl bg-green-500 flex items-center justify-center">
                        <i class="fas fa-comments text-white text-lg"></i>
                    </div>
                    <span class="text-sm text-gray-500 font-medium">Replies</span>
                </div>
                <p id="totalReplies" class="text-3xl font-black text-gray-800">0</p>
            </div>
            <div class="stat-card rounded-2xl p-5 border border-purple-100 shadow-sm card-hover">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-10 h-10 rounded-xl bg-purple-500 flex items-center justify-center">
                        <i class="fas fa-envelope text-white text-lg"></i>
                    </div>
                    <span class="text-sm text-gray-500 font-medium">Inquiries</span>
                </div>
                <p id="totalInquiries" class="text-3xl font-black text-gray-800">0</p>
            </div>
        </div>

        <!-- Search & Filter Bar -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-6">
            <div class="flex flex-col md:flex-row gap-3">
                <div class="flex-1 relative">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="searchInput" placeholder="Search advertisements..." 
                        class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all"
                        oninput="renderPosts()">
                </div>
                <select id="platformFilter" class="px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none bg-white" onchange="renderPosts()">
                    <option value="all">All Platforms</option>
                    <option value="Facebook">Facebook</option>
                    <option value="Instagram">Instagram</option>
                    <option value="TikTok">TikTok</option>
                    <option value="WhatsApp">WhatsApp</option>
                    <option value="Twitter">Twitter/X</option>
                    <option value="YouTube">YouTube</option>
                    <option value="Other">Other</option>
                </select>
                <input type="date" id="dateFilter" class="px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none" onchange="renderPosts()">
                <button onclick="clearFilters()" class="px-4 py-3 rounded-xl bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all font-medium">
                    <i class="fas fa-times mr-1"></i> Clear
                </button>
            </div>
        </div>

        <!-- Posts Grid -->
        <div id="postsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Posts will be rendered here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20">
            <div class="w-24 h-24 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-bullhorn text-blue-500 text-4xl"></i>
            </div>
            <h3 class="text-2xl font-bold text-gray-700 mb-2">No Posts Yet</h3>
            <p class="text-gray-500 mb-6">Start tracking your social media engagement</p>
            <button onclick="openAddModal()" class="px-6 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition-all">
                <i class="fas fa-plus mr-2"></i> Add Your First Post
            </button>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="postModal" class="fixed inset-0 z-50 hidden">
        <div class="modal-overlay absolute inset-0" onclick="closeModal()"></div>
        <div class="absolute inset-4 md:inset-10 lg:inset-20 bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col">
            <!-- Modal Header -->
            <div class="gradient-bg text-white px-6 py-4 flex items-center justify-between flex-shrink-0">
                <h2 id="modalTitle" class="text-xl font-bold">
                    <i class="fas fa-plus-circle mr-2"></i> Add New Post
                </h2>
                <button onclick="closeModal()" class="w-10 h-10 rounded-full bg-white/20 hover:bg-white/30 transition-all flex items-center justify-center">
                    <i class="fas fa-times text-lg"></i>
                </button>
            </div>
            <!-- Modal Body -->
            <div class="flex-1 overflow-y-auto p-6">
                <form id="postForm" onsubmit="savePost(event)">
                    <input type="hidden" id="postId">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Title -->
                        <div class="md:col-span-2">
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Advertisement/Post Title *</label>
                            <input type="text" id="postTitle" required placeholder="e.g. Samsung Galaxy A56 Promotion"
                                class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none">
                        </div>

                        <!-- Platform -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Platform *</label>
                            <select id="postPlatform" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none bg-white">
                                <option value="">Select platform...</option>
                                <option value="Facebook">Facebook</option>
                                <option value="Instagram">Instagram</option>
                                <option value="TikTok">TikTok</option>
                                <option value="WhatsApp">WhatsApp</option>
                                <option value="Twitter">Twitter/X</option>
                                <option value="YouTube">YouTube</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <!-- Date Posted -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Date Posted *</label>
                            <input type="date" id="postDate" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none">
                        </div>

                        <!-- Views -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2"><i class="fas fa-eye mr-1 text-blue-500"></i> Views</label>
                            <input type="number" id="postViews" min="0" value="0" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none">
                        </div>

                        <!-- Reactions/Likes -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2"><i class="fas fa-heart mr-1 text-red-500"></i> Reactions/Likes</label>
                            <input type="number" id="postReactions" min="0" value="0" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none">
                        </div>

                        <!-- Comments/Replies -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2"><i class="fas fa-comments mr-1 text-green-500"></i> Comments/Replies</label>
                            <input type="number" id="postComments" min="0" value="0" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none">
                        </div>

                        <!-- Direct Inquiries -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2"><i class="fas fa-envelope mr-1 text-purple-500"></i> Direct Inquiries/Messages</label>
                            <input type="number" id="postInquiries" min="0" value="0" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none">
                        </div>

                        <!-- Post Link -->
                        <div class="md:col-span-2">
                            <label class="block text-sm font-semibold text-gray-700 mb-2"><i class="fas fa-link mr-1 text-gray-400"></i> Post/Advertisement Link (optional)</label>
                            <input type="url" id="postLink" placeholder="https://..." class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none">
                        </div>

                        <!-- Screenshot Upload -->
                        <div class="md:col-span-2">
                            <label class="block text-sm font-semibold text-gray-700 mb-2"><i class="fas fa-camera mr-1 text-gray-400"></i> Post Screenshot (optional)</label>
                            <div class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:border-blue-400 transition-all cursor-pointer" onclick="document.getElementById('screenshotInput').click()">
                                <input type="file" id="screenshotInput" accept="image/*" class="hidden" onchange="handleScreenshot(event)">
                                <div id="uploadPlaceholder">
                                    <i class="fas fa-cloud-upload-alt text-4xl text-gray-300 mb-2"></i>
                                    <p class="text-gray-500">Click to upload screenshot</p>
                                    <p class="text-xs text-gray-400">PNG, JPG up to 5MB</p>
                                </div>
                                <div id="screenshotPreview" class="hidden">
                                    <img id="previewImg" class="max-h-48 mx-auto rounded-lg shadow-md">
                                    <button type="button" onclick="removeScreenshot(event)" class="mt-3 px-4 py-1 bg-red-100 text-red-600 rounded-lg text-sm hover:bg-red-200">
                                        <i class="fas fa-trash mr-1"></i> Remove
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Submit Buttons -->
                    <div class="flex gap-3 mt-8 pt-6 border-t border-gray-100">
                        <button type="submit" class="flex-1 px-6 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition-all shadow-lg">
                            <i class="fas fa-save mr-2"></i> Save Post
                        </button>
                        <button type="button" onclick="closeModal()" class="px-6 py-3 bg-gray-100 text-gray-600 rounded-xl font-bold hover:bg-gray-200 transition-all">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- View Post Modal -->
    <div id="viewModal" class="fixed inset-0 z-50 hidden">
        <div class="modal-overlay absolute inset-0" onclick="closeViewModal()"></div>
        <div class="absolute inset-4 md:inset-10 lg:inset-20 bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col">
            <div class="gradient-bg text-white px-6 py-4 flex items-center justify-between flex-shrink-0">
                <h2 class="text-xl font-bold"><i class="fas fa-bullhorn mr-2"></i> Post Details</h2>
                <button onclick="closeViewModal()" class="w-10 h-10 rounded-full bg-white/20 hover:bg-white/30 transition-all flex items-center justify-center">
                    <i class="fas fa-times text-lg"></i>
                </button>
            </div>
            <div id="viewModalBody" class="flex-1 overflow-y-auto p-6">
                <!-- Content rendered by JS -->
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="fixed inset-0 z-50 hidden">
        <div class="modal-overlay absolute inset-0" onclick="closeDeleteModal()"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4">
            <div class="text-center">
                <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-trash-alt text-red-500 text-2xl"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">Delete Post?</h3>
                <p class="text-gray-500 mb-6">This action cannot be undone.</p>
                <div class="flex gap-3">
                    <button onclick="confirmDelete()" class="flex-1 px-6 py-3 bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 transition-all">
                        <i class="fas fa-trash mr-2"></i> Delete
                    </button>
                    <button onclick="closeDeleteModal()" class="flex-1 px-6 py-3 bg-gray-100 text-gray-600 rounded-xl font-bold hover:bg-gray-200 transition-all">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== DATA MANAGEMENT ====================
        const STORAGE_KEY = 'rusha_social_media_data';
        let currentScreenshot = null;
        let deleteTargetId = null;

        function getPosts() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            } catch { return []; }
        }

        function savePosts(posts) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
        }

        // ==================== SUMMARY CARDS ====================
        function updateSummary() {
            const posts = getPosts();
            const totals = posts.reduce((acc, p) => ({
                views: acc.views + (parseInt(p.views) || 0),
                reactions: acc.reactions + (parseInt(p.reactions) || 0),
                replies: acc.replies + (parseInt(p.comments) || 0),
                inquiries: acc.inquiries + (parseInt(p.inquiries) || 0)
            }), { views: 0, reactions: 0, replies: 0, inquiries: 0 });

            animateNumber('totalViews', totals.views);
            animateNumber('totalReactions', totals.reactions);
            animateNumber('totalReplies', totals.replies);
            animateNumber('totalInquiries', totals.inquiries);
        }

        function animateNumber(id, target) {
            const el = document.getElementById(id);
            const current = parseInt(el.textContent.replace(/,/g, '')) || 0;
            const diff = target - current;
            const steps = 30;
            const increment = diff / steps;
            let step = 0;
            const timer = setInterval(() => {
                step++;
                el.textContent = Math.round(current + increment * step).toLocaleString();
                if (step >= steps) { el.textContent = target.toLocaleString(); clearInterval(timer); }
            }, 20);
        }

        // ==================== RENDER POSTS ====================
        function renderPosts() {
            const posts = getPosts();
            const search = document.getElementById('searchInput').value.toLowerCase();
            const platform = document.getElementById('platformFilter').value;
            const dateFilter = document.getElementById('dateFilter').value;

            let filtered = posts.filter(p => {
                const matchSearch = !search || p.title.toLowerCase().includes(search);
                const matchPlatform = platform === 'all' || p.platform === platform;
                const matchDate = !dateFilter || p.date === dateFilter;
                return matchSearch && matchPlatform && matchDate;
            });

            // Sort by date newest first
            filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

            const grid = document.getElementById('postsGrid');
            const empty = document.getElementById('emptyState');

            if (filtered.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            grid.innerHTML = filtered.map(post => {
                const platformClass = 'platform-' + post.platform.toLowerCase().replace('/', '');
                const totalEngagement = (parseInt(post.views) || 0) + (parseInt(post.reactions) || 0) + (parseInt(post.comments) || 0) + (parseInt(post.inquiries) || 0);
                
                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden card-hover">
                    ${post.screenshot ? `<img src="${post.screenshot}" class="w-full h-48 object-cover" alt="Post screenshot">` : 
                    `<div class="w-full h-48 bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center">
                        <i class="fas fa-bullhorn text-white text-5xl opacity-30"></i>
                    </div>`}
                    <div class="p-5">
                        <div class="flex items-start justify-between mb-3">
                            <h3 class="font-bold text-gray-800 text-lg leading-tight flex-1 mr-2">${escapeHtml(post.title)}</h3>
                            <span class="${platformClass} text-white text-xs font-bold px-3 py-1 rounded-full whitespace-nowrap">${escapeHtml(post.platform)}</span>
                        </div>
                        <p class="text-sm text-gray-500 mb-4"><i class="fas fa-calendar mr-1"></i> ${formatDate(post.date)}</p>
                        
                        <!-- Stats Row -->
                        <div class="grid grid-cols-4 gap-2 mb-4">
                            <div class="text-center p-2 bg-blue-50 rounded-lg">
                                <i class="fas fa-eye text-blue-500 text-sm"></i>
                                <p class="font-bold text-gray-800 text-sm">${(parseInt(post.views) || 0).toLocaleString()}</p>
                                <p class="text-xs text-gray-400">Views</p>
                            </div>
                            <div class="text-center p-2 bg-red-50 rounded-lg">
                                <i class="fas fa-heart text-red-500 text-sm"></i>
                                <p class="font-bold text-gray-800 text-sm">${(parseInt(post.reactions) || 0).toLocaleString()}</p>
                                <p class="text-xs text-gray-400">Likes</p>
                            </div>
                            <div class="text-center p-2 bg-green-50 rounded-lg">
                                <i class="fas fa-comments text-green-500 text-sm"></i>
                                <p class="font-bold text-gray-800 text-sm">${(parseInt(post.comments) || 0).toLocaleString()}</p>
                                <p class="text-xs text-gray-400">Replies</p>
                            </div>
                            <div class="text-center p-2 bg-purple-50 rounded-lg">
                                <i class="fas fa-envelope text-purple-500 text-sm"></i>
                                <p class="font-bold text-gray-800 text-sm">${(parseInt(post.inquiries) || 0).toLocaleString()}</p>
                                <p class="text-xs text-gray-400">Inquiries</p>
                            </div>
                        </div>

                        <!-- Engagement Bar -->
                        <div class="bg-gray-50 rounded-lg p-3 mb-4">
                            <div class="flex items-center justify-between text-xs text-gray-500 mb-1">
                                <span>Total Engagement</span>
                                <span class="font-bold text-gray-700">${totalEngagement.toLocaleString()}</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div class="bg-gradient-to-r from-blue-500 to-purple-500 h-2 rounded-full" style="width: ${Math.min(100, totalEngagement > 0 ? 100 : 0)}%"></div>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex gap-2">
                            <button onclick="viewPost('${post.id}')" class="flex-1 px-3 py-2 bg-blue-50 text-blue-600 rounded-lg text-sm font-semibold hover:bg-blue-100 transition-all">
                                <i class="fas fa-eye mr-1"></i> View
                            </button>
                            <button onclick="editPost('${post.id}')" class="flex-1 px-3 py-2 bg-amber-50 text-amber-600 rounded-lg text-sm font-semibold hover:bg-amber-100 transition-all">
                                <i class="fas fa-edit mr-1"></i> Edit
                            </button>
                            <button onclick="deletePost('${post.id}')" class="px-3 py-2 bg-red-50 text-red-600 rounded-lg text-sm font-semibold hover:bg-red-100 transition-all">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // ==================== MODAL OPERATIONS ====================
        function openAddModal() {
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-plus-circle mr-2"></i> Add New Post';
            document.getElementById('postForm').reset();
            document.getElementById('postId').value = '';
            document.getElementById('postDate').value = new Date().toISOString().split('T')[0];
            currentScreenshot = null;
            document.getElementById('uploadPlaceholder').classList.remove('hidden');
            document.getElementById('screenshotPreview').classList.add('hidden');
            document.getElementById('postModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('postModal').classList.add('hidden');
        }

        function savePost(e) {
            e.preventDefault();
            const posts = getPosts();
            const id = document.getElementById('postId').value;
            const postData = {
                id: id || Date.now().toString(),
                title: document.getElementById('postTitle').value.trim(),
                platform: document.getElementById('postPlatform').value,
                date: document.getElementById('postDate').value,
                views: document.getElementById('postViews').value || 0,
                reactions: document.getElementById('postReactions').value || 0,
                comments: document.getElementById('postComments').value || 0,
                inquiries: document.getElementById('postInquiries').value || 0,
                link: document.getElementById('postLink').value.trim(),
                screenshot: currentScreenshot,
                updatedAt: new Date().toISOString()
            };

            if (id) {
                const idx = posts.findIndex(p => p.id === id);
                if (idx !== -1) posts[idx] = { ...posts[idx], ...postData };
            } else {
                postData.createdAt = new Date().toISOString();
                posts.push(postData);
            }

            savePosts(posts);
            updateSummary();
            renderPosts();
            closeModal();
        }

        function editPost(id) {
            const posts = getPosts();
            const post = posts.find(p => p.id === id);
            if (!post) return;

            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit mr-2"></i> Edit Post';
            document.getElementById('postId').value = post.id;
            document.getElementById('postTitle').value = post.title;
            document.getElementById('postPlatform').value = post.platform;
            document.getElementById('postDate').value = post.date;
            document.getElementById('postViews').value = post.views || 0;
            document.getElementById('postReactions').value = post.reactions || 0;
            document.getElementById('postComments').value = post.comments || 0;
            document.getElementById('postInquiries').value = post.inquiries || 0;
            document.getElementById('postLink').value = post.link || '';

            currentScreenshot = post.screenshot;
            if (post.screenshot) {
                document.getElementById('uploadPlaceholder').classList.add('hidden');
                document.getElementById('screenshotPreview').classList.remove('hidden');
                document.getElementById('previewImg').src = post.screenshot;
            } else {
                document.getElementById('uploadPlaceholder').classList.remove('hidden');
                document.getElementById('screenshotPreview').classList.add('hidden');
            }

            document.getElementById('postModal').classList.remove('hidden');
        }

        function deletePost(id) {
            deleteTargetId = id;
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        function confirmDelete() {
            if (!deleteTargetId) return;
            let posts = getPosts();
            posts = posts.filter(p => p.id !== deleteTargetId);
            savePosts(posts);
            updateSummary();
            renderPosts();
            closeDeleteModal();
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            deleteTargetId = null;
        }

        function viewPost(id) {
            const posts = getPosts();
            const post = posts.find(p => p.id === id);
            if (!post) return;

            const totalEngagement = (parseInt(post.views) || 0) + (parseInt(post.reactions) || 0) + (parseInt(post.comments) || 0) + (parseInt(post.inquiries) || 0);
            const platformClass = 'platform-' + post.platform.toLowerCase().replace('/', '');

            document.getElementById('viewModalBody').innerHTML = `
                ${post.screenshot ? `<img src="${post.screenshot}" class="w-full max-h-80 object-contain rounded-xl mb-6 shadow-lg" alt="Post screenshot">` : ''}
                <div class="flex items-center gap-3 mb-4">
                    <h3 class="text-2xl font-bold text-gray-800">${escapeHtml(post.title)}</h3>
                    <span class="${platformClass} text-white text-sm font-bold px-4 py-1 rounded-full">${escapeHtml(post.platform)}</span>
                </div>
                <p class="text-gray-500 mb-6"><i class="fas fa-calendar mr-2"></i>Posted on ${formatDate(post.date)}</p>
                
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div class="bg-blue-50 rounded-xl p-4 text-center">
                        <i class="fas fa-eye text-blue-500 text-2xl mb-2"></i>
                        <p class="text-3xl font-black text-gray-800">${(parseInt(post.views) || 0).toLocaleString()}</p>
                        <p class="text-sm text-gray-500">Views</p>
                    </div>
                    <div class="bg-red-50 rounded-xl p-4 text-center">
                        <i class="fas fa-heart text-red-500 text-2xl mb-2"></i>
                        <p class="text-3xl font-black text-gray-800">${(parseInt(post.reactions) || 0).toLocaleString()}</p>
                        <p class="text-sm text-gray-500">Reactions</p>
                    </div>
                    <div class="bg-green-50 rounded-xl p-4 text-center">
                        <i class="fas fa-comments text-green-500 text-2xl mb-2"></i>
                        <p class="text-3xl font-black text-gray-800">${(parseInt(post.comments) || 0).toLocaleString()}</p>
                        <p class="text-sm text-gray-500">Replies</p>
                    </div>
                    <div class="bg-purple-50 rounded-xl p-4 text-center">
                        <i class="fas fa-envelope text-purple-500 text-2xl mb-2"></i>
                        <p class="text-3xl font-black text-gray-800">${(parseInt(post.inquiries) || 0).toLocaleString()}</p>
                        <p class="text-sm text-gray-500">Inquiries</p>
                    </div>
                </div>

                <div class="bg-gray-50 rounded-xl p-4 mb-6">
                    <div class="flex items-center justify-between mb-2">
                        <span class="font-semibold text-gray-700">Total Engagement</span>
                        <span class="text-2xl font-black text-blue-600">${totalEngagement.toLocaleString()}</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-3">
                        <div class="bg-gradient-to-r from-blue-500 to-purple-500 h-3 rounded-full" style="width: ${Math.min(100, totalEngagement > 0 ? 100 : 0)}%"></div>
                    </div>
                </div>

                ${post.link ? `<div class="mb-6"><a href="${escapeHtml(post.link)}" target="_blank" class="inline-flex items-center gap-2 px-4 py-2 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 transition-all font-medium"><i class="fas fa-external-link-alt"></i> View Original Post</a></div>` : ''}
                
                <div class="flex gap-3">
                    <button onclick="closeViewModal(); editPost('${post.id}')" class="flex-1 px-4 py-3 bg-amber-500 text-white rounded-xl font-bold hover:bg-amber-600 transition-all">
                        <i class="fas fa-edit mr-2"></i> Edit
                    </button>
                    <button onclick="closeViewModal()" class="px-6 py-3 bg-gray-200 text-gray-700 rounded-xl font-bold hover:bg-gray-300 transition-all">
                        Close
                    </button>
                </div>
            `;
            document.getElementById('viewModal').classList.remove('hidden');
        }

        function closeViewModal() {
            document.getElementById('viewModal').classList.add('hidden');
        }

        // ==================== SCREENSHOT HANDLING ====================
        function handleScreenshot(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) { alert('File too large. Max 5MB.'); return; }
            
            const reader = new FileReader();
            reader.onload = function(ev) {
                currentScreenshot = ev.target.result;
                document.getElementById('uploadPlaceholder').classList.add('hidden');
                document.getElementById('screenshotPreview').classList.remove('hidden');
                document.getElementById('previewImg').src = currentScreenshot;
            };
            reader.readAsDataURL(file);
        }

        function removeScreenshot(e) {
            e.stopPropagation();
            currentScreenshot = null;
            document.getElementById('uploadPlaceholder').classList.remove('hidden');
            document.getElementById('screenshotPreview').classList.add('hidden');
            document.getElementById('screenshotInput').value = '';
        }

        // ==================== UTILITIES ====================
        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('platformFilter').value = 'all';
            document.getElementById('dateFilter').value = '';
            renderPosts();
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ==================== INIT ====================
        updateSummary();
        renderPosts();
    </script>
</body>
</html>
